name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'neo4j_exporter/**'
      - 'jq/**'
      - 'temporal_admin/**'
      - 'gitlab_runner/**'
      - '.github/workflows/docker-publish.yml'

env:
  DOCKERHUB_REPO_TERRAFORM: ricklin/terraform
  DOCKERHUB_REPO_NEO4J_EXPORTER: ricklin/neo4j_exporter
  DOCKERHUB_REPO_TEMPORAL_ADMIN_TOOLS: ricklin/temporal_admin_tools
  DOCKERHUB_REPO_JQ: ricklin/jq
  DOCKERHUB_REPO_GITLAB_RUNNER: ricklin/gitlab_runner
  TERRAFORM_VERSION: 1.13.1
  JQ_VERSION: 1.8.1

jobs:
  echo_context:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      neo4j_exporter: ${{ steps.filter.outputs.neo4j_exporter }}
      temporal_admin: ${{ steps.filter.outputs.temporal_admin }}
      jq: ${{ steps.filter.outputs.jq }}
      gitlab_runner: ${{ steps.filter.outputs.gitlab_runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/docker-publish.yml'
            neo4j_exporter:
              - 'neo4j_exporter/**'
              - '.github/workflows/docker-publish.yml'
            temporal_admin:
              - 'temporal_admin/**'
              - '.github/workflows/docker-publish.yml'
            jq:
              - 'jq/**'
              - '.github/workflows/docker-publish.yml'
            gitlab_runner:
              - 'gitlab_runner/**'
              - '.github/workflows/docker-publish.yml'

  build-and-push-terraform:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.terraform == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Push git tag
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: "${{ secrets.MY_GITHUB_TOKEN }}"
          tag: "${{ env.TERRAFORM_VERSION }}-${{ steps.vars.outputs.sha_short }}"

      - name: Build and push Terraform image
        uses: docker/build-push-action@v5
        with:
          context: ./terraform
          file: ./terraform/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
          tags: |
            ${{ env.DOCKERHUB_REPO_TERRAFORM }}:latest
            ${{ env.DOCKERHUB_REPO_TERRAFORM }}:${{ env.TERRAFORM_VERSION }}-${{ steps.vars.outputs.sha_short }}

  build-and-push-neo4j-exporter:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.neo4j_exporter == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Neo4j Exporter image
        uses: docker/build-push-action@v5
        with:
          context: ./neo4j_exporter
          file: ./neo4j_exporter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_NEO4J_EXPORTER }}:latest
            ${{ env.DOCKERHUB_REPO_NEO4J_EXPORTER }}:${{ steps.vars.outputs.sha_short }}

  build-and-push-temporal-admin:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.temporal_admin == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Temporal admin tool image
        uses: docker/build-push-action@v5
        with:
          context: ./temporal_admin
          file: ./temporal_admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_TEMPORAL_ADMIN_TOOLS }}:latest
            ${{ env.DOCKERHUB_REPO_TEMPORAL_ADMIN_TOOLS }}:${{ steps.vars.outputs.sha_short }}

  build-and-push-jq:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.jq == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push jq image
        uses: docker/build-push-action@v5
        with:
          context: ./jq
          file: ./jq/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JQ_VERSION=${{ env.JQ_VERSION }}
          tags: |
            ${{ env.DOCKERHUB_REPO_JQ }}:latest
            ${{ env.DOCKERHUB_REPO_JQ }}:${{ env.JQ_VERSION }}-${{ steps.vars.outputs.sha_short }}

  build-and-push-gitlab-runner:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.gitlab_runner == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push GitLab Runner image
        uses: docker/build-push-action@v5
        with:
          context: ./gitlab_runner
          file: ./gitlab_runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_GITLAB_RUNNER }}:latest
            ${{ env.DOCKERHUB_REPO_GITLAB_RUNNER }}:${{ steps.vars.outputs.sha_short }}
